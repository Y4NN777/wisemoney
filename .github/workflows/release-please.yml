name: release-please

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    # Enable only after v1.0.0 has been tagged and published. This prevents the
    # initial release from being reconstructed from the repository's full history.
    if: vars.WISEMONEY_RELEASE_AUTOMATION == 'enabled'
    runs-on: ubuntu-24.04
    steps:
      - name: Maintain the next release pull request
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
