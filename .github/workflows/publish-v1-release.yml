name: publish-v1-release

on:
  push:
    tags: ["v1.0.0"]

permissions:
  contents: write

jobs:
  publish:
    name: publish-v1-release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout tagged release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Verify tag and release metadata
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "v1.0.0"
          test "$(node -p "require('./package.json').version")" = "1.0.0"
          grep -Fq "## [1.0.0] - 2026-08-17" CHANGELOG.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          --verify-tag
          --title "WiseMoney v1.0.0"
          --notes-file .github/releases/v1.0.0.md
