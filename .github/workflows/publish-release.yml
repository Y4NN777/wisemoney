name: publish-release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    name: publish-release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout tagged release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Verify tag and release metadata
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          test "${GITHUB_REF_NAME}" = "v${version}"
          test "$(node -p "require('./package.json').version")" = "${version}"
          test "$(node -p "require('./apps/web/package.json').version")" = "${version}"
          test "$(node -p "require('./apps/web/src/releases/releases.json')[0].version")" = "${version}"
          test -f ".github/releases/v${version}.md"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" = "v1.0.0" ]; then
            gh release delete v1.0.1 --cleanup-tag --yes || true
          fi
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --title "WiseMoney ${GITHUB_REF_NAME}" \
              --notes-file ".github/releases/${GITHUB_REF_NAME}.md"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --verify-tag \
              --title "WiseMoney ${GITHUB_REF_NAME}" \
              --notes-file ".github/releases/${GITHUB_REF_NAME}.md"
          fi
